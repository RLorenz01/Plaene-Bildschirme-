<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Schulmonitor – Vertretungspläne</title>
  <style>
    :root { --navy:#112d50; --blue:#1b4978; --gold:#ffcf39; --paper:#fff; --bg:#eaf0f7; --ink:#1d2b3e; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:var(--bg); }
    body { display:flex; flex-direction:column; overflow:hidden; }
    header { flex:0 0 7.5vh; min-height:54px; display:flex; justify-content:space-between; align-items:center; padding:6px 1.4vw; color:white; background:var(--navy); gap:10px; }
    .school-brand {display:flex; align-items:center; gap:.8vw; min-width:0;}
    .school-logo {width:clamp(38px,5.5vh,66px);height:clamp(38px,5.5vh,66px);object-fit:contain;background:#fff;border-radius:50%;padding:2px;flex-shrink:0;}
    .logo-placeholder {width:clamp(38px,5.5vh,66px);height:clamp(38px,5.5vh,66px);border:2px solid #caddf3;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:12px;text-align:center;color:#fff;flex-shrink:0;}
    .school { font-size:clamp(17px,1.65vw,27px); font-weight:750; }
    .subtitle { font-size:clamp(10px,.85vw,15px); color:#caddf3; margin-top:2px; }
    .clock { text-align:right; white-space:nowrap; font-size:clamp(17px,1.6vw,27px); font-weight:700; }
    .clock small {display:block;font-size:clamp(10px,.85vw,15px);font-weight:400;color:#caddf3;margin-top:2px}
    main { flex:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:.7vw; padding:.7vw; min-height:0; }
    .panel { background:var(--paper); border-radius:12px; box-shadow:0 3px 12px #2038551a; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
    .panel-head { position:relative; }
    .new-badge { display:none; position:absolute; right:12px; top:50%; transform:translateY(-50%); background:#b8202b; color:#fff; font-size:clamp(13px,1.1vw,19px); font-weight:900; padding:6px 12px; border-radius:7px; letter-spacing:.06em; box-shadow:0 1px 5px #0003; }
    .new-badge.visible {display:inline-block;}
    .ticker-update {display:none; flex:0 0 auto; margin-left:10px; background:#aa1724; color:white; border-radius:6px; padding:7px 12px; font-size:clamp(12px,1.1vw,19px); font-weight:bold; white-space:nowrap; }
    .ticker-update.visible {display:block;}
    .panel-head { padding:.45vw .85vw; background:#d9e7f7; border-bottom:2px solid #b6cde5; }
    .panel:last-child .panel-head { background:#e6ecf4; }
    .kicker {font-weight:800; color:#194670; font-size:clamp(12px,1.1vw,19px);letter-spacing:.08em}
    .daydate {font-size:clamp(13px,1.2vw,20px);margin-top:2px;font-weight:600}
    .plan-area { flex:1; overflow:hidden; min-height:0; position:relative; }
    .plan-content {width:100%; will-change:transform;}
    .scroll-wrap { height:100%; overflow:hidden; position:relative; }
    .plan-inner { position:relative; width:100%; }
    .scroll-status { color:#576c80; font-size:clamp(10px,.8vw,14px); margin-left:10px; }
    tr:nth-child(even) td { background:#f7fafe; }
    .plan-content td:last-child {overflow-wrap:anywhere;}
    .notice {padding:13px 18px; color:#29425d; font-size:clamp(12px,1vw,17px); background:#edf4fb;border-top:1px solid #dce4ee;}
    .error { padding:20px; color:#852525; font-weight:bold; }
    .status-card { display:flex; height:100%; min-height:180px; flex-direction:column; justify-content:center; align-items:center; gap:16px; padding:4vw 2vw; text-align:center; }
    .status-card .status-symbol { font-size:clamp(38px,4vw,68px); line-height:1; }
    .status-card h2 { margin:0; font-size:clamp(22px,2vw,36px); line-height:1.2; }
    .status-card p { margin:0; font-size:clamp(16px,1.3vw,23px); line-height:1.4; max-width:35ch; }
    .status-future { color:#274d77; background:#eef5fc; }
    .status-today { color:#8c2727; background:#fff0ed; border:4px solid #df6b62; }
    .status-error { color:#8c571e; background:#fff8e6; border:4px solid #e5b44a; }
    .plan-meta { color:#526c85; font-size:clamp(12px,1vw,17px); padding:5px 9px; background:#f0f5fb; }

    table {width:100%; border-collapse:collapse; font-size:clamp(13px,1.16vw,20px);}
    th { background:#f5f8fc; font-size:.9em; color:#41566b; text-align:left; padding:7px 8px; position:sticky;top:0; }
    td { padding:8px 8px; border-bottom:1px solid #dce4ee; vertical-align:middle; }
    td:first-child {font-weight:800; color:#133b61}
    .pill {display:inline-block; border-radius:6px;padding:5px 8px;background:#e2ecfa; font-weight:700; white-space:nowrap;}
    .cancel { color:#9b2020;background:#ffe3e3; }
    .empty { padding:24px; font-size:clamp(14px,1.4vw,22px); }
    .plan-frame {width:100%;height:100%;border:0;background:white;}
    .footnote {flex:0 0 auto; background:#f4f7fb; color:#586d81; padding:4px .85vw;font-size:clamp(11px,.9vw,16px);border-top:1px solid #e1e8f1;}
    footer {height:7.5vh;min-height:48px;max-height:76px; background:var(--gold);display:flex; align-items:center; overflow:hidden; flex:none; border-top:4px solid #e7ad13;}
    .info-label {position:relative;z-index:2;background:#f7c125;height:100%;display:flex;align-items:center;gap:9px;padding:0 1.4vw; font-size:clamp(14px,1.25vw,21px);font-weight:800;white-space:nowrap;box-shadow:5px 0 13px #93650036}
    .ticker-window {min-width:0; flex:1; overflow:hidden;}
    .ticker-text {white-space:nowrap;width:max-content;font-size:clamp(16px,1.6vw,27px);font-weight:700;animation:marquee 35s linear infinite; padding-left:100%;}
    @keyframes marquee { to {transform:translateX(-100%)} }
    @media (prefers-reduced-motion:reduce) { .ticker-text {animation:none;padding-left:16px;} }
    @media (max-width:700px) { header{min-height:54px} main{gap:8px;padding:8px} .panel-head{padding:6px} th,td{padding:6px 4px} .info-label{padding:0 8px} }
  </style>
</head>
<body>
  <header>
    <div class="school-brand">
      <!-- Original-Schullogo als schullogo.png neben index.html speichern. -->
      <img class="school-logo" src="schullogo.png" alt="Schullogo Seiler-Gymnasium Schlotheim" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex'">
      <div class="logo-placeholder" id="logoFallback">SEILER<br>GYMNASIUM</div>
      <div><div class="school" id="schoolName"></div><div class="subtitle">Vertretungsplan · Aktuelle Informationen</div></div>
    </div>
    <div class="clock"><span id="time">--:--</span><small id="todayClock"></small></div>
  </header>
  <main>
    <section class="panel">
      <div class="panel-head"><div class="kicker">HEUTE</div><div class="daydate" id="dateToday"></div><span class="new-badge" id="todayNew" aria-label="Plan aktualisiert">NEU</span></div>
      <div class="plan-area" id="todayArea"></div>
      <div class="footnote" id="todayNote"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><div class="kicker">NÄCHSTER UNTERRICHTSTAG</div><div class="daydate" id="dateNext"></div><span class="new-badge" id="nextNew" aria-label="Plan aktualisiert">NEU</span></div>
      <div class="plan-area" id="nextArea"></div>
      <div class="footnote" id="nextNote"></div>
    </section>
  </main>
  <footer>
    <div class="info-label">📢 INFO</div><div class="ticker-update" id="tickerUpdate"></div>
    <div class="ticker-window"><div class="ticker-text" id="tickerText"></div></div>
  </footer>
<script>
  // ================================================================
  // HIER ANPASSEN – Diese Werte lassen sich auch ohne Fachkenntnisse ändern.
  // ================================================================
  const EINSTELLUNGEN = {
    schulname: 'Seiler-Gymnasium Schlotheim',
    laufband: 'Willkommen am Seiler-Gymnasium Schlotheim!', // Ersatztext, falls mitteilungen.txt fehlt
    // Automatisch die Indiware-Dateien mit Tagesdatum laden.
    // Fehlen die Dateien, erscheint eine klare Meldung statt erfundener Pläne.
    anzeige: 'indiware',
    dateinameAnfang: 'Vertretungsplan Schüler',
    // Ferien Thüringen 2026/27 nach KMK, jeweils inklusive Start- und Endtag.
    ferien: [
      ['2026-10-12','2026-10-24'], // Herbst
      ['2026-12-23','2027-01-02'], // Weihnachten
      ['2027-02-01','2027-02-06'], // Winter
      ['2027-03-22','2027-04-03'], // Ostern
      ['2027-05-07','2027-05-07'], // schulfreier Tag nach Himmelfahrt
      ['2027-07-10','2027-08-20']  // Sommer
    ],
    // Gesetzliche Feiertage an Schultagen, die nicht schon Ferien sind.
    feiertage: ['2026-12-25','2027-01-01','2027-03-26','2027-03-29',
                '2027-05-06','2027-05-17'],
    // Bewegliche Ferientage des Seiler-Gymnasiums Schlotheim.
    schulfreieTage: ['2026-11-30','2027-02-08'],
    // Nach 5 Minuten die Seite neu laden, damit neue Dateien sichtbar werden.
    neuladenMinuten: 5,
    scrollPixelProSekunde: 24,
    pauseObenSekunden: 5,
    pauseUntenSekunden: 5,
    // Kennzeichnung bleibt bis Mitternacht des Entdeckungstages sichtbar.
    neuHinweisBisTagesende: true
  };

  // FIKTIVE MUSTERDATEN: NICHT als echten Vertretungsplan verwenden.
  const MUSTER_HEUTE = [
    ['5a','2.','Deutsch','Vertretung'],['6b','3.','Sport','Entfall'],
    ['7a','4.','Englisch','Raum 204'],['8b','5.','Mathematik','Vertretung'],
    ['9a','6.','Biologie','Entfall']
  ];
  const MUSTER_NAECHSTER = [
    ['5b','1.','Mathematik','Raum 103'],['6a','2.','Deutsch','Vertretung'],
    ['8a','4.','Physik','Entfall'],['9c','5.','Englisch','Vertretung'],
    ['10a','6.','Geschichte','Raum 210']
  ];

  const datumFormat = new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  const kurzFormat = new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  const $ = id => document.getElementById(id);
  const heute = new Date(); heute.setHours(12,0,0,0);
  const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  function schulTag(d) {
    const tag=isoLocal(d);
    return d.getDay()!==0 && d.getDay()!==6
      && !EINSTELLUNGEN.ferien.some(([von,bis])=>von<=tag && tag<=bis)
      && !EINSTELLUNGEN.feiertage.includes(tag)
      && !EINSTELLUNGEN.schulfreieTage.includes(tag);
  }
  function unterrichtstagAb(d) {
    const n=new Date(d);
    for(let i=0;i<366;i++){if(schulTag(n))return n;n.setDate(n.getDate()+1);}
    return n;
  }
  function dateinameFuer(d) { return EINSTELLUNGEN.dateinameAnfang+isoLocal(d)+'.html'; }
  function naechsterUnterrichtstag(d) {
    const n=new Date(d); n.setDate(n.getDate()+1);
    for(let i=0;i<366;i++){if(schulTag(n))return n;n.setDate(n.getDate()+1);}
    return n;
  }
  function uhr() {
    const n=new Date(); $('time').textContent=n.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    $('todayClock').textContent=kurzFormat.format(n);
    // Datum täglich korrekt aktualisieren: bei Tageswechsel Seite neu laden.
    if (isoLocal(n)!==isoLocal(heute)) location.reload();
  }
  function encode(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');}
  function scrollendeTabelle(ziel, inhalt) {
    const area=$(ziel);area.replaceChildren();
    const wrap=document.createElement('div');wrap.className='scroll-wrap';
    const inner=document.createElement('div');inner.className='plan-content';
    inner.append(inhalt);wrap.append(inner);area.append(wrap);
    let start=performance.now(), lastMaximum=-1;
    // Bei einem langen Plan wird die Tabelle langsam nach unten und wieder nach oben bewegt.
    // Sind alle Einträge sichtbar, bleibt die Tabelle stehen.
    function frame(time) {
      if(!wrap.isConnected)return;
      const max=Math.max(0,inner.scrollHeight-wrap.clientHeight);
      if(max!==lastMaximum){start=time;lastMaximum=max;}
      if(max>2){
        const velocity=Math.max(5,Number(EINSTELLUNGEN.scrollPixelProSekunde)||24);
        const topPause=(Number(EINSTELLUNGEN.pauseObenSekunden)||5)*1000;
        const bottomPause=(Number(EINSTELLUNGEN.pauseUntenSekunden)||5)*1000;
        const travel=max/velocity*1000;
        const cycle=topPause+travel+bottomPause+travel;
        let t=(time-start)%cycle,pos=0;
        if(t<topPause) pos=0;
        else if(t<topPause+travel) pos=(t-topPause)/1000*velocity;
        else if(t<topPause+travel+bottomPause) pos=max;
        else pos=max-(t-topPause-travel-bottomPause)/1000*velocity;
        inner.style.transform='translateY(-'+Math.max(0,Math.min(max,pos))+'px)';
      }else inner.style.transform='';
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function zeigeMuster(ziel,zeilen) {
    const container=document.createElement('div');
    const table=document.createElement('table');
    table.innerHTML='<thead><tr><th>Klasse</th><th>Std.</th><th>Fach</th><th>Änderung</th></tr></thead><tbody>'+zeilen.map(r=>`<tr><td>${encode(r[0])}</td><td>${encode(r[1])}</td><td>${encode(r[2])}</td><td><span class="pill ${r[3]==='Entfall'?'cancel':''}">${encode(r[3])}</span></td></tr>`).join('')+'</tbody>';
    container.append(table);scrollendeTabelle(ziel,container);
  }
  function zeigeFehlendenPlan(ziel, notiz, modus, detail='') {
    const area=$(ziel);
    area.replaceChildren();
    const card=document.createElement('div');
    card.className='status-card '+(modus==='zukunft'?'status-future':modus==='heute'?'status-today':'status-error');
    const icon=document.createElement('div');icon.className='status-symbol';
    icon.textContent=modus==='zukunft'?'◷':modus==='heute'?'!':'⚠';
    const title=document.createElement('h2');
    title.textContent=modus==='zukunft'?'Noch kein Vertretungsplan veröffentlicht':modus==='heute'?'Aktueller Vertretungsplan fehlt':'Vertretungsplan derzeit nicht lesbar';
    const message=document.createElement('p');
    message.textContent=modus==='zukunft'?'Für diesen Tag liegt noch kein veröffentlichter Vertretungsplan vor.':modus==='heute'?'Für heute ist kein aktueller Vertretungsplan verfügbar. Bitte im Sekretariat informieren.':'Die Plandatei konnte nicht korrekt verarbeitet werden. Bitte die Veröffentlichung prüfen.';
    card.append(icon,title,message);area.append(card);
    $(notiz).textContent=modus==='zukunft'?'Noch keine Veröffentlichung für diesen Unterrichtstag':modus==='heute'?'WICHTIG: Heutiger Plan fehlt':'Technischer Fehler beim Laden des Plans'+(detail?' ('+detail+')':'');
  }
  // Versionserkennung im Browser des jeweiligen Smart-TVs.
  // Es wird nur ein NEU-Hinweis ausgelöst, wenn dieses Gerät für dasselbe Datum
  // bereits eine ANDERE gültige Plandatei gesehen hat. Erstveröffentlichungen bleiben unmarkiert.
  const planVersionen = new Map();
  function gespeicherterStand(iso) {
    try { return JSON.parse(localStorage.getItem('seiler-plan-v2-'+iso) || 'null'); }
    catch(e) { return planVersionen.get(iso) || null; }
  }
  function standSpeichern(iso, wert) {
    planVersionen.set(iso,wert);
    try { localStorage.setItem('seiler-plan-v2-'+iso,JSON.stringify(wert)); } catch(e) {}
  }
  function textFingerabdruck(text) {
    // Stabiler schneller Prüfsummenvergleich der tatsächlich veröffentlichten Datei.
    let h=2166136261;
    for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619);}
    return String(h>>>0)+':'+text.length;
  }
  function aktualisierungErkennen(datum, neuerWert) {
    const iso=isoLocal(datum);
    const vorher=gespeicherterStand(iso);
    const laufenderTag=isoLocal(new Date());
    const marker = (vorher?.markiertAm===laufenderTag) ? laufenderTag : null;
    let markiertAm=marker;
    if(vorher && vorher.version!=='fehlt' && vorher.version!==neuerWert && neuerWert!=='fehlt') {
      markiertAm=laufenderTag;
    }
    standSpeichern(iso,{version:neuerWert,markiertAm});
    aktualisierungsanzeigen();
  }
  function aktualisierungsanzeigen() {
    const heuteIso=isoLocal(new Date());
    const markiert=[];
    for(const [badgeId,tagId] of [['todayNew','dateToday'],['nextNew','dateNext']]) {
      const datum=$(tagId).dataset.iso;
      const zustand=datum ? gespeicherterStand(datum) : null;
      const aktiv=!!zustand && zustand.markiertAm===heuteIso && zustand.version!=='fehlt';
      $(badgeId).classList.toggle('visible',aktiv);
      if(aktiv)markiert.push(badgeId==='todayNew'?'heute':'nächsten Unterrichtstag');
    }
    const el=$('tickerUpdate');
    el.classList.toggle('visible',markiert.length>0);
    el.textContent=markiert.length ? 'ACHTUNG: Neuer Vertretungsplan für '+markiert.join(' und ')+'!' : '';
  }
  async function zeigeIndiware(ziel,datei,datum,notiz,modus) {
    try {
      // Indiware 7 kennzeichnet diese Exporte als ISO-8859-1.
      // Aus den Original-HTML-Dateien wird nur die Unterrichtstabelle übernommen.
      const antwort=await fetch(encodeURI(datei)+'?stand='+Date.now(),{cache:'no-store'});
      if(antwort.status===404){aktualisierungErkennen(datum,'fehlt');zeigeFehlendenPlan(ziel,notiz,modus);return;}
      if(!antwort.ok)throw new Error('Serverantwort HTTP '+antwort.status);
      const bytes=await antwort.arrayBuffer();
      const html=new TextDecoder('windows-1252').decode(bytes);
      const doc=new DOMParser().parseFromString(html,'text/html');
      const table=doc.querySelector('table.tablekopf');
      if(!table)throw new Error('Keine Indiware-Unterrichtstabelle gefunden');
      const titel=doc.querySelector('.vpfuerdatum')?.textContent.trim() || '';
      const expected=datumFormat.format(datum).toLocaleLowerCase('de-DE');
      if(titel && !titel.toLocaleLowerCase('de-DE').includes(expected)) {
        throw new Error('Falscher Tag in Datei: '+titel+' (erwartet '+datumFormat.format(datum)+')');
      }
      const rows=Array.from(table.querySelectorAll('tr'));
      const inhalt=document.createElement('div');
      const parsed=document.createElement('table');
      const headers=['Klasse','Std.','Fach','Lehrkraft','Raum','Info'];
      const thead=document.createElement('thead'), trh=document.createElement('tr');
      headers.forEach(x=>{const th=document.createElement('th');th.textContent=x;trh.append(th)});
      thead.append(trh);parsed.append(thead);
      const tbody=document.createElement('tbody');
      rows.slice(1).forEach(r=>{
        const cells=Array.from(r.querySelectorAll('td'));
        if(!cells.length)return;
        const tr=document.createElement('tr');
        for(let i=0;i<headers.length;i++){
          const td=document.createElement('td');td.textContent=(cells[i]?.textContent||'').trim();
          if(i===5&&/fällt aus/i.test(td.textContent))td.className='cancel';
          tr.append(td);
        }
        tbody.append(tr);
      });
      parsed.append(tbody);inhalt.append(parsed);
      // Zusätzliche Informationen sichtbar, keine Abwesenheitslisten anzeigen.
      const extra=Array.from(doc.querySelectorAll('.ueberschrift')).find(e=>/Zusätzliche Informationen/i.test(e.textContent));
      if(extra){
        const t=extra.nextElementSibling?.tagName==='TABLE'?extra.nextElementSibling:extra.parentElement?.querySelector('table:last-of-type');
        const notes=t?Array.from(t.querySelectorAll('td')).map(x=>x.textContent.trim()).filter(Boolean):[];
        if(notes.length){const note=document.createElement('div');note.className='notice';note.textContent='Zusätzliche Informationen: '+notes.join(' · ');inhalt.append(note);}
      }
      scrollendeTabelle(ziel,inhalt);
      const stand=doc.querySelector('.vpdatum')?.textContent.trim()||'ohne Zeitangabe';
      $(notiz).textContent='Planstand: '+stand+' · '+tbody.children.length+' Änderungen';
      aktualisierungErkennen(datum,textFingerabdruck(html));
    } catch(e) {
      console.warn('Indiware-Plan konnte nicht geladen werden:',datei,e);
      zeigeFehlendenPlan(ziel,notiz,'fehler',e.message);
    }
  }
  // Mitteilungen als einfache Textdatei laden, ganz ohne Bearbeitung des HTML-Codes.
  // Pro Zeile eine Mitteilung; leere Zeilen werden übersprungen.
  async function mitteilungenLaden() {
    try {
      const antwort = await fetch('mitteilungen.txt?zeit='+Date.now(), {cache:'no-store'});
      if (!antwort.ok) throw new Error('Datei nicht erreichbar');
      const inhalt = await antwort.text();
      const zeilen = inhalt.split(/\r?\n/).map(z => z.trim()).filter(Boolean);
      $('tickerText').textContent = zeilen.length ? zeilen.join('     ✦     ') + '     ✦     ' : 'Zurzeit keine zusätzlichen Mitteilungen';
    } catch (fehler) {
      $('tickerText').textContent = EINSTELLUNGEN.laufband;
      console.warn('Mitteilungen konnten nicht geladen werden:', fehler);
    }
  }
  function initialisieren() {
    $('schoolName').textContent=EINSTELLUNGEN.schulname;
    $('tickerText').textContent=EINSTELLUNGEN.laufband;
    mitteilungenLaden();
    const erster=unterrichtstagAb(heute);
    $('dateToday').textContent=datumFormat.format(erster);
    $('dateToday').dataset.iso=isoLocal(erster);
    $('dateToday').previousElementSibling.textContent=isoLocal(erster)===isoLocal(heute)?'HEUTE':'NÄCHSTER UNTERRICHTSTAG';
    const next=naechsterUnterrichtstag(erster);
    $('dateNext').textContent=datumFormat.format(next);
    $('dateNext').dataset.iso=isoLocal(next);
    if(EINSTELLUNGEN.anzeige==='indiware') {
      const ersterIstHeute=isoLocal(erster)===isoLocal(heute);
      zeigeIndiware('todayArea',dateinameFuer(erster),erster,'todayNote',ersterIstHeute?'heute':'zukunft');
      zeigeIndiware('nextArea',dateinameFuer(next),next,'nextNote','zukunft');
    } else {
      zeigeMuster('todayArea',MUSTER_HEUTE);zeigeMuster('nextArea',MUSTER_NAECHSTER);
      $('todayNote').textContent='DEMONSTRATION – keine echten Plandaten';
      $('nextNote').textContent='DEMONSTRATION – keine echten Plandaten';
    }
    aktualisierungsanzeigen();
    uhr();setInterval(uhr,10000);
    if(EINSTELLUNGEN.neuladenMinuten>0) setInterval(()=>location.reload(),EINSTELLUNGEN.neuladenMinuten*60000);
  }
  initialisieren();
</script>
</body>
</html>
